<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#180810" />
    <title>The Gathering is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #180810;
        color: #f5e6e2;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 32rem;
      }

      img {
        width: 4rem;
        height: 4rem;
      }

      button {
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 999px;
        background: #c75b7a;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo.svg" alt="" />
      <h1>The Gathering is offline</h1>
      <p>Reconnect to your server, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
