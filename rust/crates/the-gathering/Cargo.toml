[package]
name = "the-gathering"
description = "The Gathering's server: the JSON API, realtime webcam tables, Discord bot, and background jobs."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "the-gathering"
path = "src/main.rs"

[dependencies]
the-gathering-sfu = { path = "../sfu" }
lotus = { git = "https://github.com/cfbender/lotus", features = ["sqlx", "http"] }

anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
bcrypt = "0.17"
bytes = "1"
chacha20poly1305 = "0.10"
csv = "1"
eetf = "0.10"
futures-util = "0.3"
hmac = "0.12"
http = "1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
pbkdf2 = "0.12"
rand = "0.9"
regex = "1"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite-bundled", "time", "json"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "serde"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = "0.29"
wiremock = "0.6"

[lints]
workspace = true
