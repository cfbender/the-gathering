[tools]
aube = "1.21.0"
elixir = "1.20.4-otp-29"
erlang = { version = "29.0.6", install_env = { KERL_CONFIGURE_OPTIONS = "--without-javac --without-odbc --without-wx" } }
node = "26.9.0"

[tasks.setup]
description = "Install project tools, Elixir dependencies, database, and assets."
run = "mise install && aube install --frozen-lockfile && mix setup"

[tasks.dev]
description = "Start the Phoenix development server (also starts the Vite dev server)."
run = "mix phx.server"

[tasks.test]
description = "Run the Elixir test suite."
run = "mix test"

[tasks.precommit]
description = "Run tests and linting before committing code."
run = "mix precommit"
