[tools]
aube = "1.21.0"
node = "26.9.0"
rust = { version = "1.99.0", components = "clippy,rustfmt" }
sqlite = "3.53.4"

[tasks.setup]
description = "Install project tools and JavaScript dependencies, build the server, and prepare the dev database."
run = [
  "mise install",
  "aube install --frozen-lockfile",
  "cargo build --manifest-path rust/Cargo.toml --locked",
  "rust/target/debug/the-gathering migrate",
  "rust/target/debug/the-gathering seed",
]
env = { THE_GATHERING_ENV = "dev" }

[tasks.dev]
description = "Start the Rust server on $PORT (default 4000) and the Vite dev server on 5173."
run = "bash rust/scripts/dev.sh"

[tasks.test]
description = "Run the Rust test suite."
dir = "rust"
run = "cargo test --locked"

[tasks.precommit]
description = "Run tests and linting before committing code."
run = ["mise run rust:check", "aube run precommit"]

[tasks."rust:check"]
description = "Check the schema dump, then format-check, lint, and test the Rust workspace."
dir = "rust"
run = [
  "bash scripts/schema.sh --check",
  "cargo fmt --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  "cargo test --locked",
]

[tasks."rust:sweep"]
description = "Drop incremental-compilation caches untouched for 7 days (DAYS=n to change) and show rust/target's size."
dir = "rust"
run = '''
#!/usr/bin/env bash
set -euo pipefail
days="${DAYS:-7}"
find target -mindepth 3 -maxdepth 3 -path 'target/*/incremental/*' -type d -mtime "+$days" -exec rm -rf {} + 2>/dev/null || true
du -sh target 2>/dev/null || true
echo "Run cargo clean in rust/ when that is still too large; the next build is a cold one."
'''

[tasks."rust:bench"]
description = "Measure cold, edit-then-build, edit-then-check, and edit-then-test compile times (see rust/notes/compile-times.md)."
run = "bash rust/scripts/bench-build.sh"

[tasks."rust:new-migration"]
description = "Create rust/migrations/<UTC timestamp>_<name>.sql: mise run rust:new-migration add_widgets"
run = '''
#!/usr/bin/env bash
set -euo pipefail
name="${usage_name:?}"
[[ "$name" =~ ^[a-z0-9_]+$ ]] || { echo "name must be snake_case" >&2; exit 1; }
file="rust/migrations/$(date -u +%Y%m%d%H%M%S)_${name}.sql"
printf -- '-- Migration %s.\n' "$(basename "$file" .sql | sed 's/_/: /')" >"$file"
echo "$file"
'''
usage = 'arg "<name>" help="snake_case migration name"'

[tasks."rust:schema"]
description = "Rebuild rust/target/schema.db and rust/schema.sql from rust/migrations."
run = "bash rust/scripts/schema.sh"

[tasks."rust:schema-db"]
description = "Alias of rust:schema, for online query checking while developing."
run = "bash rust/scripts/schema.sh"

[tasks."rust:sqlx-prepare"]
description = "Rebuild the schema from rust/migrations and regenerate the sqlx query metadata in rust/.sqlx."
run = '''
#!/usr/bin/env bash
set -euo pipefail
bash rust/scripts/schema.sh
cd rust
rm -rf .sqlx && mkdir .sqlx
# Query macros only re-expand when their crate recompiles.
find crates -name '*.rs' -exec touch {} +
SQLX_OFFLINE=false DATABASE_URL="sqlite://$PWD/target/schema.db?mode=ro" SQLX_OFFLINE_DIR="$PWD/.sqlx" \
  cargo check --workspace --all-targets
'''
