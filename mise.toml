[tools]
aube = "1.21.0"
elixir = "1.20.4-otp-29"
erlang = { version = "29.1.1", install_env = { KERL_CONFIGURE_OPTIONS = "--without-javac --without-odbc --without-wx" } }
node = "26.9.0"
rust = { version = "1.99.0", components = "clippy,rustfmt" }
sqlite = "3.53.4"

[tasks.setup]
description = "Install project tools, Elixir dependencies, database, and assets."
run = "mise install && aube install --frozen-lockfile && mix setup"

[tasks.dev]
description = "Start the Rust server on $PORT (default 4000) and the Vite dev server on 5173."
run = "bash rust/scripts/dev.sh"

[tasks."dev:elixir"]
description = "Start the legacy Phoenix development server (also starts the Vite dev server)."
run = "mix phx.server"

[tasks.test]
description = "Run the Rust test suite."
dir = "rust"
run = "cargo test --locked"

[tasks.precommit]
description = "Run tests and linting before committing code."
run = [
  "mise run rust:check",
  "aube run precommit",
]

[tasks."rust:check"]
description = "Format-check, lint, and test the Rust workspace."
dir = "rust"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  "cargo test --locked",
]

[tasks."rust:migrations"]
description = "Regenerate rust/migrations/*.sql from the Ecto migrations (run after adding one)."
run = '''
#!/usr/bin/env bash
set -euo pipefail
export MIX_ENV=test MIX_TEST_PARTITION=_rust_migrations
rm -f the_gathering_test_rust_migrations.db*
mix ecto.create --quiet
mix ecto.migrate --log-migrations-sql > tmp-migrations.log 2>&1
python3 rust/scripts/dump-migrations.py tmp-migrations.log rust/migrations
rm -f tmp-migrations.log the_gathering_test_rust_migrations.db*
'''

[tasks."rust:sqlx-prepare"]
description = "Dump the Ecto schema to priv/repo/structure.sql and regenerate the sqlx query metadata in rust/.sqlx."
run = '''
#!/usr/bin/env bash
set -euo pipefail
mix ecto.migrate
mix ecto.dump
# Migration timestamps differ per machine; blank them so the dump is reproducible.
sed -i -E "s/^(INSERT INTO schema_migrations VALUES\([0-9]+),'[^']*'\);$/\1,NULL);/" priv/repo/structure.sql
cd rust
mkdir -p target
rm -f target/schema.db
grep -v '^CREATE TABLE sqlite_' ../priv/repo/structure.sql | sqlite3 target/schema.db
rm -rf .sqlx && mkdir .sqlx
# Query macros only re-expand when their crate recompiles.
find crates -name '*.rs' -exec touch {} +
SQLX_OFFLINE=false DATABASE_URL="sqlite://$PWD/target/schema.db?mode=ro" SQLX_OFFLINE_DIR="$PWD/.sqlx" \
  cargo check --workspace --all-targets
'''

[tasks."rust:schema-db"]
description = "Load priv/repo/structure.sql into rust/target/schema.db for online query checking while developing."
dir = "rust"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p target
rm -f target/schema.db
grep -v '^CREATE TABLE sqlite_' ../priv/repo/structure.sql | sqlite3 target/schema.db
'''
