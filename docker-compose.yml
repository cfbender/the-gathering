services:
  the-gathering:
    image: ghcr.io/cfbender/the-gathering:latest
    container_name: the-gathering
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # SQLite, uploaded files, and the disposable card-images cache (512 MiB, 30 days).
      - ./data:/data
    environment:
      # Generate with: openssl rand -base64 64 | tr -d '\n'
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      # Public hostname (and scheme) users reach the app at, used for generated URLs.
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      PHX_URL_PORT: ${PHX_URL_PORT:-4000}
      # Set to true behind a reverse proxy so login rate limiting sees real client addresses.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-}
      CARDID_CORRECTIONS_TOKEN: ${CARDID_CORRECTIONS_TOKEN:-}
      CARDID_CORRECTIONS_ADMIN_ID: ${CARDID_CORRECTIONS_ADMIN_ID:-}
      # Optional WebRTC NAT traversal for webcam tables (comma-separated URLs).
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-}
      WEBRTC_TURN_URLS: ${WEBRTC_TURN_URLS:-}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-}
      WEBRTC_TURN_CREDENTIAL: ${WEBRTC_TURN_CREDENTIAL:-}
      # Or a Cloudflare Realtime TURN key; the server mints short-lived credentials per room join.
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      # debug explains why the Discord bot ignored a message.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional self-hosted ManaVault origin whose shared deck links should resolve.
      MANAVAULT_URL: ${MANAVAULT_URL:-}
      # Exact personal ManaVault hosts allowed on private networks (comma-separated).
      MANAVAULT_ALLOWED_HOSTS: ${MANAVAULT_ALLOWED_HOSTS:-}
      # Permit personal HTTP origins that otherwise resolve to public addresses.
      MANAVAULT_ALLOW_INSECURE_URLS: ${MANAVAULT_ALLOW_INSECURE_URLS:-}

      # Discord OAuth credentials enable member sign-in.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Optional Discord game tracking. An empty token leaves the client disabled.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_DEFAULT_TIMEZONE: ${DISCORD_DEFAULT_TIMEZONE:-America/New_York}
      DISCORD_SPELLBOT_USER_ID: ${DISCORD_SPELLBOT_USER_ID:-725510263251402832}
