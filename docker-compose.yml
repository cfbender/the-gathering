services:
  the-gathering:
    image: ghcr.io/cfbender/the-gathering:latest
    container_name: the-gathering
    restart: unless-stopped
    ports:
      - "4000:4000"
      # Webcam-table SFU media (UDP). Keep in step with WEBRTC_SFU_PORT_RANGE and forward the
      # same range from your router, or set WEBRTC_SFU_RELAY_ONLY=true and drop this line.
      - "50000-50100:50000-50100/udp"
    volumes:
      # SQLite, uploaded files, and the disposable card-images cache (512 MiB, 30 days).
      - ./data:/data
    labels:
      # Lets the watchtower service below (profile self-update) recreate this container.
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      # Generate with: openssl rand -base64 64 | tr -d '\n'
      THE_GATHERING_SECRET_KEY: ${THE_GATHERING_SECRET_KEY:-}
      # Public address users reach the app at, used for generated URLs.
      THE_GATHERING_PUBLIC_URL: ${THE_GATHERING_PUBLIC_URL:-}
      # Names used by releases up to 0.2; still read (with a warning) when the ones above are unset.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      PHX_HOST: ${PHX_HOST:-}
      PHX_SCHEME: ${PHX_SCHEME:-}
      PHX_URL_PORT: ${PHX_URL_PORT:-}
      # Set to true behind a reverse proxy so login rate limiting sees real client addresses.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-}
      CARDID_CORRECTIONS_TOKEN: ${CARDID_CORRECTIONS_TOKEN:-}
      CARDID_CORRECTIONS_ADMIN_ID: ${CARDID_CORRECTIONS_ADMIN_ID:-}
      # Optional WebRTC NAT traversal for webcam tables (comma-separated URLs).
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-}
      WEBRTC_TURN_URLS: ${WEBRTC_TURN_URLS:-}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-}
      WEBRTC_TURN_CREDENTIAL: ${WEBRTC_TURN_CREDENTIAL:-}
      # Or a Cloudflare Realtime TURN key; the server mints short-lived credentials per room join.
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      # Webcam-table SFU: the UDP range it listens on, the public address browsers reach it
      # at, or relay-only to send all media through the TURN servers above.
      WEBRTC_SFU_PORT_RANGE: ${WEBRTC_SFU_PORT_RANGE:-}
      WEBRTC_SFU_PUBLIC_IP: ${WEBRTC_SFU_PUBLIC_IP:-}
      WEBRTC_SFU_RELAY_ONLY: ${WEBRTC_SFU_RELAY_ONLY:-}
      # debug explains why the Discord bot ignored a message.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional self-hosted ManaVault origin whose shared deck links should resolve.
      MANAVAULT_URL: ${MANAVAULT_URL:-}
      # Exact personal ManaVault hosts allowed on private networks (comma-separated).
      MANAVAULT_ALLOWED_HOSTS: ${MANAVAULT_ALLOWED_HOSTS:-}
      # Permit personal HTTP origins that otherwise resolve to public addresses.
      MANAVAULT_ALLOW_INSECURE_URLS: ${MANAVAULT_ALLOW_INSECURE_URLS:-}

      # Discord OAuth credentials enable member sign-in.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Optional Discord game tracking. An empty token leaves the client disabled.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_DEFAULT_TIMEZONE: ${DISCORD_DEFAULT_TIMEZONE:-America/New_York}
      DISCORD_SPELLBOT_USER_ID: ${DISCORD_SPELLBOT_USER_ID:-725510263251402832}

      # "Update now" under Administration > Server settings asks the watchtower service below to
      # pull this image's tag and recreate the container. Set COMPOSE_PROFILES=self-update and
      # WATCHTOWER_HTTP_API_TOKEN in .env to turn it on; the button stays hidden otherwise.
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
      WATCHTOWER_URL: ${WATCHTOWER_URL:-http://watchtower:8080}
      WATCHTOWER_IMAGE: ${WATCHTOWER_IMAGE:-ghcr.io/cfbender/the-gathering}

  # Optional (profile self-update): a Watchtower whose HTTP API only the app can reach. It does
  # not poll on a schedule; it updates when the app asks. Only containers carrying the
  # com.centurylinklabs.watchtower.enable label are touched.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: the-gathering-watchtower
    restart: unless-stopped
    profiles: [self-update]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove the previous image after an update.
      WATCHTOWER_CLEANUP: "true"
