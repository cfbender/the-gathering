name: Release

# Builds the release tarball (the Rust server plus the built React app) that
# deploy/proxmox/the-gathering.sh installs
# (bare-metal / LXC, no Docker). Version tags publish a GitHub release; every push to
# main republishes the rolling "nightly" prerelease (tag moved to the commit) that
# `update nightly` / VERSION=nightly install. The container image is built separately
# by container.yml.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Nightly builds share one tag and asset names, so never publish two at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26.9.0
  NODE_SHA256: c6ecd8efc1c1d395265891675319da7a7b3785c6be174bd78933cf4f057624d1
  AUBE_VERSION: 1.21.0
  AUBE_SHA256: f56cb4db3b47e47b51ca8f05677dad7ddef25079e5a81f0ec6afaa0d54201bbe

jobs:
  release:
    name: Build release tarball
    runs-on: ubuntu-latest
    # Build on the same Debian release the installer targets (Debian 13 "trixie") so the
    # server links against the glibc the container ships. Keep Rust aligned with mise.toml.
    container:
      image: rust:1.99.0-trixie

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential git curl ca-certificates xz-utils pkg-config >/dev/null

      # The checksums are verified either way, so a cached tarball is as trusted as a fresh one.
      - name: Cache Node and aube downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: downloads
          key: release-tools-node-${{ env.NODE_VERSION }}-aube-${{ env.AUBE_VERSION }}

      - name: Install Node and aube
        run: |
          set -eu
          mkdir -p downloads
          [ -f downloads/node.tar.xz ] || curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o downloads/node.tar.xz
          echo "${NODE_SHA256}  downloads/node.tar.xz" | sha256sum -c -
          tar -xJf downloads/node.tar.xz -C /usr/local --strip-components=1
          [ -f downloads/aube.tar.gz ] || curl -fsSL "https://github.com/aubepkg/aube/releases/download/v${AUBE_VERSION}/aube-v${AUBE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o downloads/aube.tar.gz
          echo "${AUBE_SHA256}  downloads/aube.tar.gz" | sha256sum -c -
          tar -xzf downloads/aube.tar.gz -C /tmp aube
          install /tmp/aube /usr/local/bin/aube
          node --version
          aube --version

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            rust/target
          key: release-cargo-${{ hashFiles('rust/Cargo.lock', '.github/workflows/release.yml') }}
          restore-keys: release-cargo-

      - name: Cache JavaScript dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: release-aube-${{ env.AUBE_VERSION }}-${{ hashFiles('aube-lock.yaml') }}

      - name: Build assets
        run: |
          aube install --frozen-lockfile
          NODE_ENV=production aube run build

      - name: Build the server
        working-directory: rust
        run: cargo build --release --locked --bin the-gathering

      # Same layout as the Elixir release (the_gathering/bin/the_gathering start | eval ...),
      # so deploy/proxmox/the-gathering.sh and existing installs keep working.
      - name: Assemble release
        id: release
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; else tag=nightly; fi
          # priv/VERSION ships inside the release: the admin UI shows it and compares it with
          # GitHub (the nightly tag's commit, or the latest release). Same format as container.yml.
          if [ "$tag" = nightly ]; then version="nightly-$(printf %s "$GITHUB_SHA" | cut -c1-7)"; else version="$tag"; fi
          rel=build/the_gathering
          rm -rf build && mkdir -p "$rel/bin" "$rel/priv"
          install -m 0755 rust/target/release/the-gathering "$rel/bin/the-gathering"
          install -m 0755 rust/release/the_gathering "$rel/bin/the_gathering"
          cp -r priv/static "$rel/priv/static"
          printf '%s\n' "$version" > "$rel/priv/VERSION"
          archive="the_gathering-${tag}-linux-amd64.tar.gz"
          tar -C build -czf "$archive" the_gathering
          sha256sum "$archive" > "${archive}.sha256"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload tarball as workflow artifact (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.archive }}
          path: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.archive }}.sha256

      # Through the API rather than git: the checkout runs in the container before git is
      # installed, so actions/checkout downloads a tarball and there is no .git to push from.
      - name: Move the nightly tag to this commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs"
          call() {
            curl -sS -o /tmp/ref.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          status="$(call -X PATCH "${api}/tags/nightly" -d "{\"sha\":\"${GITHUB_SHA}\",\"force\":true}")"
          if [ "$status" = 422 ]; then
            # The tag does not exist yet.
            status="$(call -X POST "$api" -d "{\"ref\":\"refs/tags/nightly\",\"sha\":\"${GITHUB_SHA}\"}")"
          fi
          case "$status" in
            200 | 201) echo "nightly -> ${GITHUB_SHA}" ;;
            *) cat /tmp/ref.json; echo "updating refs/tags/nightly failed with HTTP ${status}" >&2; exit 1 ;;
          esac

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.archive }}.sha256

      - name: Publish nightly prerelease
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          name: Nightly build
          body: |
            Rolling build of `main` at ${{ github.sha }}. Republished on every push, so the
            assets change under the same names. Install with `VERSION=nightly` or
            `update nightly`; `update vX.Y.Z` returns to tagged releases.
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.archive }}.sha256
