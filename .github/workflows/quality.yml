name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precommit:
    name: Precommit quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install summary image renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-dejavu-core

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install Hex and Rebar
        run: mise exec -- mix local.hex --force && mise exec -- mix local.rebar --force

      - name: Cache Elixir dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install Elixir dependencies
        run: mise exec -- mix deps.get

      - name: Install JavaScript dependencies
        run: mise exec -- aube install --frozen-lockfile

      - name: Run the precommit quality gate
        run: mise exec -- mix precommit
