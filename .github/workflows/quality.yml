name: Quality

# Parallel jobs: the Rust server (schema dump, query check, fmt, clippy, tests, and the
# Proxmox installer test) and the frontend (format, lint, typecheck, tests, build).
# "Precommit quality gate" aggregates them so branch protection keeps a single required check.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install JavaScript dependencies
        run: mise exec -- aube install --frozen-lockfile

      - name: Format, lint and typecheck
        run: mise exec -- aube exec vp check

      - name: React tests
        run: mise exec -- aube exec vp test run

      - name: Production build
        run: mise exec -- aube run build

  rust:
    name: Rust server lint and tests
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: rust,sqlite
      # Every CI build starts from the cache of a different commit; incremental state would
      # only grow the cache without making the build faster.
      CARGO_INCREMENTAL: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: rust sqlite
          cache: true

      # Caches the registry and compiled dependencies (not the workspace crates), keyed on
      # the lockfile, manifests, and cargo config, so a profile change cannot leave a stale
      # cache that every later run rebuilds from. Pull requests only restore; main and manual
      # runs save, so pull requests cannot evict the cache main's next run starts from.
      - name: Cache Cargo registry and compiled dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: rust
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
          # The key would otherwise hash every installed toolchain, and runner images differ in
          # whether a stable Rust is preinstalled besides mise's pinned one, so the key churned
          # between runs. Cargo already rebuilds anything compiled by a different rustc.
          add-rust-environment-hash-key: false

      # One debug compile does everything: clippy runs with the query macros online, which
      # checks every query against rust/migrations and rewrites rust/.sqlx; then the tests
      # build against that metadata offline.
      - name: Check schema and query metadata, format, lint, and test
        run: mise run rust:ci

      - name: Test the Proxmox LXC installer's channel handling
        run: bash deploy/proxmox/test.sh

  precommit:
    name: Precommit quality gate
    needs: [rust, frontend]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
