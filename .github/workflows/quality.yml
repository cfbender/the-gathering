name: Quality

# Parallel jobs: the Rust server (schema dump, query check, fmt, clippy, tests, and the
# Proxmox installer test) and the frontend (format, lint, typecheck, tests, build).
# "Precommit quality gate" aggregates them so branch protection keeps a single required check.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install JavaScript dependencies
        run: mise exec -- aube install --frozen-lockfile

      - name: Format, lint and typecheck
        run: mise exec -- aube exec vp check

      - name: React tests
        run: mise exec -- aube exec vp test run

      - name: Production build
        run: mise exec -- aube run build

  rust:
    name: Rust server lint and tests
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: rust,sqlite

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: rust sqlite
          cache: true

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # rust/migrations is the schema's only source; schema.sql is its committed dump.
      - name: Check that rust/schema.sql matches rust/migrations
        run: mise exec -- bash rust/scripts/schema.sh --check

      - name: Check queries against the migrated schema
        working-directory: rust
        run: |
          SQLX_OFFLINE=false DATABASE_URL="sqlite://$PWD/target/schema.db?mode=ro" \
            mise exec -- cargo check --workspace --all-targets --locked

      - name: Format, lint, and test against the committed query metadata
        run: mise run rust:check

      - name: Test the Proxmox LXC installer's channel handling
        run: bash deploy/proxmox/test.sh

  precommit:
    name: Precommit quality gate
    needs: [rust, frontend]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
